{% extends 'base.html' %}

{% block title %}Trainee Registration — SkillTrack{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
            <i class="bi bi-person-plus fs-2"></i>
          </div>
          <h4 class="fw-bold mb-1" data-i18n="auto_108">{{ 'Create Trainee Profile' }}</h4>
          <p class="text-muted small" data-i18n="auto_109">{{ 'Register to obtain your permanent SkillTrack Outcome ID' }}</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold" data-i18n="auto_110">{{ 'First Name *' }}</label>
              <input type="text" name="first_name" class="form-control" placeholder="e.g. Rahul" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold" data-i18n="auto_111">{{ 'Last Name *' }}</label>
              <input type="text" name="last_name" class="form-control" placeholder="e.g. Sharma" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" data-i18n="auto_112">{{ 'Username *' }}</label>
            <input type="text" name="username" class="form-control" placeholder="rahul_sharma" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" data-i18n="auto_113">{{ 'Email Address *' }}</label>
            <input type="email" name="email" class="form-control" placeholder="rahul@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" data-i18n="auto_114">{{ 'Password *' }}</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold" data-i18n="auto_115">{{ 'Gender' }}</label>
              <select name="gender" class="form-select">
                <option value="Male" data-i18n="auto_116">{{ 'Male' }}</option>
                <option value="Female" data-i18n="auto_117">{{ 'Female' }}</option>
                <option value="Other" data-i18n="auto_118">{{ 'Other' }}</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold" data-i18n="auto_119">{{ 'District (Maharashtra)' }}</label>
              <select name="district_id" class="form-select">
                {% for d in districts %}
                  <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold" data-i18n="auto_120">{{ 'Mobile Number' }}</label>
              <input type="tel" name="phone" class="form-control" placeholder="+91 98XXXXXXXX">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold"><i class="bi bi-linkedin text-primary me-1"></i>LinkedIn Profile (Optional)</label>
              <input type="url" name="linkedin_url" class="form-control" placeholder="https://www.linkedin.com/in/username">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            <i class="bi bi-person-check me-1"></i> Register & Generate Outcome ID
          </button>
        </form>

        <div class="text-center small text-muted">
          Already registered? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold" data-i18n="auto_121">{{ 'Sign In' }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
