{% extends 'base.html' %}

{% block title %}Sign In — SkillTrack{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
            <i class="bi bi-shield-lock fs-2"></i>
          </div>
          <h4 class="fw-bold mb-1">Sign In to SkillTrack</h4>
          <p class="text-muted small">Select your role or enter credentials to access your portal</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Registered Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center small text-muted mb-4">
          New trainee? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register Profile</a>
        </div>

        <!-- 1-Click Demo Logins for Hackathon Evaluators -->
        <div class="border-top pt-3">
          <div class="text-uppercase small fw-bold text-muted mb-2 text-center" style="font-size: 0.75rem;">
            ⚡ 1-Click Evaluator Demo Access
          </div>
          <form action="{{ url_for('auth.login') }}" method="POST" class="d-grid gap-2">
            <button type="submit" name="quick_role" value="trainee" class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between">
              <span><i class="bi bi-person me-2"></i><strong>Trainee Demo</strong></span>
              <span class="badge bg-primary">ST-MH-000123</span>
            </button>
            <button type="submit" name="quick_role" value="employer" class="btn btn-outline-success btn-sm text-start d-flex justify-content-between">
              <span><i class="bi bi-building-check me-2"></i><strong>Employer Demo</strong></span>
              <span class="badge bg-success">TCS BPS</span>
            </button>
            <button type="submit" name="quick_role" value="provider" class="btn btn-outline-info btn-sm text-start d-flex justify-content-between">
              <span><i class="bi bi-mortarboard me-2"></i><strong>Provider Demo</strong></span>
              <span class="badge bg-info text-dark">Pune Center</span>
            </button>
            <button type="submit" name="quick_role" value="government" class="btn btn-outline-warning btn-sm text-dark text-start d-flex justify-content-between">
              <span><i class="bi bi-shield-shaded me-2"></i><strong>Government Admin</strong></span>
              <span class="badge bg-warning text-dark">Full Access</span>
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
